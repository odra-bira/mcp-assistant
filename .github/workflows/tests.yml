# Runs on every push and pull request on GitHub.
# A green check mark on your repo means: all tests pass AND the safety layer blocked every attack.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit and end-to-end tests
        run: python -m pytest -q

      - name: Benchmark plumbing + safety gate (demo brain, no AI needed)
        run: python bench/benchmark.py --brain demo --ci
